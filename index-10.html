function decode64(s){const bin=atob(s);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function current(){const p=location.hash.replace(/^#\/?/,'').split(/[?&]/)[0];return PAGES[p]?p:'index'}
function render(){const page=current();let doc=decode64(PAGES[page]);
// Keep navigation inside this single file and preserve query strings.
doc=doc.replace(/href=(['"])(?:\.\/)?(index|products|cart|about|contact|admin)\.html([^'"]*)\1/g,(m,q,n,tail)=>'href="javascript:parent.location.hash=\'/'+n+tail+'\'"');
doc=doc.replace(/window\.location\.href\s*=\s*(['"])(?:\.\/)?(index|products|cart|about|contact|admin)\.html\1/g,(m,q,n)=>'window.parent.location.hash="/'+n+'"');
document.getElementById('site').srcdoc=doc;
}
window.addEventListener('hashchange',render);render();
